<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#222222">
  <title>벽돌깨기</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="blockbreak.css">
</head>
<body>
  <div class="game-container">
    <div class="game-area">
      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="canvas-hud">
          <span id="stage">스테이지: 1</span>
          <span id="score">점수: 0</span>
        </div>
        <div id="mainOverlay" class="overlay">
          <div class="main-modal">
            <h1>벽돌깨기</h1>
            <div class="main-buttons">
              <button id="newGameBtn">새 게임</button>
              <button id="openSettingsBtn">설정</button>
            </div>
          </div>
        </div>
        <div id="preGameOverlay" class="overlay hidden">
          <button id="startGameBtn">시작</button>
        </div>
        <div id="settingsOverlay" class="overlay hidden">
          <div class="settings-modal">
            <h2>설정</h2>
            <div id="main-settings">
              <div class="setting-group">
                <label>색상</label>
                <div class="preset-buttons">
                  <button type="button" data-preset="default" class="preset-btn active">기본</button>
                  <button type="button" data-preset="pastel"  class="preset-btn">파스텔톤</button>
                  <button type="button" data-preset="neon"    class="preset-btn">형광색</button>
                </div>
              </div>
              <div class="setting-group">
                <label>배경</label>
                <div class="preset-buttons">
                  <button type="button" data-bg="default" class="bg-preset-btn active">기본</button>
                  <button type="button" data-bg="space"   class="bg-preset-btn">우주</button>
                  <button type="button" data-bg="forest"  class="bg-preset-btn">숲</button>
                </div>
              </div>
              <div class="setting-group">
                <label>BGM</label>
                <div class="preset-buttons">
                  <button type="button" data-bgm="on"  class="bgm-toggle-btn active">켜기</button>
                  <button type="button" data-bgm="off" class="bgm-toggle-btn">끄기</button>
                </div>
              </div>
              <div class="setting-group">
                <label>효과음</label>
                <div class="preset-buttons">
                  <button type="button" data-sfx="on"  class="sfx-toggle-btn active">켜기</button>
                  <button type="button" data-sfx="off" class="sfx-toggle-btn">끄기</button>
                </div>
              </div>
            </div>
            <button id="closeSettingsBtn">닫기</button>
          </div>
        </div>
        <div id="confirmOverlay" class="overlay hidden">
          <div class="clear-modal">
            <h2 id="clear-message">스테이지 클리어!</h2>
            <button id="confirmBtn">확인</button>
          </div>
        </div>
        <div id="winOverlay" class="overlay hidden">
          <div class="win-modal">
            <h2>Winner!</h2>
            <p>점수: <span id="win-score">0</span></p>
            <button id="restartBtn">재시작</button>
            <button id="winMainBtn">메인으로</button>
          </div>
        </div>
        <div id="gameoverOverlay" class="overlay hidden">
          <div class="gameover-modal">
            <h2>Game Over</h2>
            <button id="gameoverRestartBtn">재시작</button>
            <button id="gameoverMainBtn">메인으로</button>
          </div>
        </div>
        <div id="shopOverlay" class="overlay hidden">
          <div class="shop-modal">
            <div class="shop-left">
              <h2>상점 (골드: <span id="shop-gold">0</span>)</h2>
              <div class="shop-item">
                <span>공 데미지 +1</span>
                <button id="buy-damage" class="buy-btn"><span id="price-damage">5</span> G</button>
              </div>
              <div class="shop-item">
                <span>패드 크기 +20</span>
                <button id="buy-paddle" class="buy-btn"><span id="price-paddle">5</span> G</button>
              </div>
              <div class="shop-item">
                <span>황금 타일 +3</span>
                <button id="buy-goldchance" class="buy-btn"><span id="price-goldchance">5</span> G</button>
              </div>
              <div class="shop-item">
                <span>보호막</span>
                <button id="buy-shield" class="buy-btn"><span id="price-shield">20</span> G</button>
              </div>
              <button id="nextStageBtn">다음 스테이지</button>
            </div>
            <div class="shop-right" id="rewardSection">
              <h3>무작위 아이템</h3>
              <div class="reward-cards">
                <button type="button" class="reward-card" data-slot="0">
                  <span class="reward-name">?</span>
                  <span class="reward-desc">(준비 중)</span>
                </button>
                <button type="button" class="reward-card" data-slot="1">
                  <span class="reward-name">?</span>
                  <span class="reward-desc">(준비 중)</span>
                </button>
                <button type="button" class="reward-card" data-slot="2">
                  <span class="reward-name">?</span>
                  <span class="reward-desc">(준비 중)</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="rotateOverlay">
        <div id="rotateMessage">
          <div style="font-size:48px">↻</div>
          <div>화면을 가로로 돌려주세요</div>
        </div>
      </div>
      <div class="controls">
        <span id="message"></span>
      </div>
      <div class="test-controls">
        <span class="test-label">테스트:</span>
        <button id="testWinBtn">승리 처리</button>
      </div>
    </div>
    <div class="legend">
      <h3>특수 블록</h3>
      <div class="legend-row">
        <span class="legend-color" id="legend-armor" style="background:#7fb3ff"></span>
        <span>갑옷 — 한 번에 1 데미지만 받음 (HP 3 고정)</span>
      </div>
      <div class="legend-row">
        <span class="legend-color" id="legend-indestructible" style="background:#3a3a3a"></span>
        <span>파괴 불가 — 점수 없이 튕김만, 클리어 조건 제외</span>
      </div>
      <div class="legend-row">
        <span class="legend-color" id="legend-hardened" style="background:#7c3aed"></span>
        <span>강화 — HP 2배</span>
      </div>
    </div>
    <aside class="shop-panel">
      <h3>업그레이드</h3>
      <div class="stat-row"><span>공 데미지</span><span id="stat-damage">1</span></div>
      <div class="stat-row"><span>패드 크기</span><span id="stat-paddle">100</span></div>
      <div class="stat-row"><span>황금 타일</span><span id="stat-goldchance">0</span></div>
      <hr>
      <div class="stat-row"><span>골드</span><span id="stat-gold">0</span></div>
      <hr>
      <h3>보유 아이템</h3>
      <div id="picked-items"></div>
    </aside>
  </div>
  <audio id="bgmAudio" src="../assets/bgm.mp3" loop preload="auto"></audio>
  <script src="items.js"></script>
  <script src="blockbreak.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        reg.addEventListener('updatefound', () => {
          const next = reg.installing;
          next.addEventListener('statechange', () => {
            if (next.state === 'activated') location.reload();
          });
        });
      });

      // SW_UPDATED 메시지 수신 시 리로드 (이미 실행 중인 탭 대응)
      let reloading = false;
      navigator.serviceWorker.addEventListener('message', e => {
        if (e.data?.type === 'SW_UPDATED' && !reloading) {
          reloading = true;
          location.reload();
        }
      });
    }
  </script>
</body>
</html>
