<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>벽돌깨기</title>
  <link rel="stylesheet" href="blockbreak.css">
</head>
<body>
  <div class="game-container">
    <div class="game-area">
      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="confirmOverlay" class="overlay hidden">
          <button id="confirmBtn">확인</button>
        </div>
        <div id="winOverlay" class="overlay hidden">
          <div class="win-modal">
            <h2>Winner!</h2>
            <p>점수: <span id="win-score">0</span></p>
            <button id="restartBtn">재시작</button>
          </div>
        </div>
        <div id="gameoverOverlay" class="overlay hidden">
          <div class="gameover-modal">
            <h2>Game Over</h2>
            <button id="gameoverRestartBtn">재시작</button>
          </div>
        </div>
        <div id="shopOverlay" class="overlay hidden">
          <div class="shop-modal">
            <h2>상점 (골드: <span id="shop-gold">0</span>)</h2>
            <div class="shop-item">
              <span>공 데미지 +1</span>
              <button id="buy-damage" class="buy-btn"><span id="price-damage">5</span> G</button>
            </div>
            <div class="shop-item">
              <span>공 크기 +2</span>
              <button id="buy-radius" class="buy-btn"><span id="price-radius">5</span> G</button>
            </div>
            <div class="shop-item">
              <span>패드 크기 +20</span>
              <button id="buy-paddle" class="buy-btn"><span id="price-paddle">5</span> G</button>
            </div>
            <div class="shop-item">
              <span>황금 확률 +10%</span>
              <button id="buy-goldchance" class="buy-btn"><span id="price-goldchance">5</span> G</button>
            </div>
            <div class="shop-item">
              <span>보호막</span>
              <button id="buy-shield" class="buy-btn"><span id="price-shield">20</span> G</button>
            </div>
            <button id="nextStageBtn">다음 스테이지</button>
          </div>
        </div>
      </div>
      <div class="controls">
        <button id="startBtn">시작</button>
        <span id="stage">스테이지: 1</span>
        <span id="score">점수: 0</span>
        <span id="message"></span>
      </div>
      <div class="test-controls">
        <span class="test-label">테스트:</span>
        <button id="testWinBtn">승리 처리</button>
      </div>
      <div class="legend">
        <h3>특수 블록</h3>
        <div class="legend-row">
          <span class="legend-color" style="background:#7fb3ff"></span>
          <span>갑옷 — 한 번에 1 데미지만 받음 (HP 5 고정)</span>
        </div>
        <div class="legend-row">
          <span class="legend-color" style="background:#3a3a3a"></span>
          <span>파괴 불가 — 점수 없이 튕김만, 클리어 조건 제외</span>
        </div>
        <div class="legend-row">
          <span class="legend-color" style="background:#7c3aed"></span>
          <span>강화 — HP 2배</span>
        </div>
      </div>
    </div>
    <aside class="shop-panel">
      <h3>업그레이드</h3>
      <div class="stat-row"><span>공 데미지</span><span id="stat-damage">1</span></div>
      <div class="stat-row"><span>공 크기</span><span id="stat-radius">8</span></div>
      <div class="stat-row"><span>패드 크기</span><span id="stat-paddle">100</span></div>
      <div class="stat-row"><span>황금 확률</span><span id="stat-goldchance">0%</span></div>
      <div class="stat-row"><span>보호막</span><span id="stat-shield">0</span></div>
      <hr>
      <div class="stat-row"><span>골드</span><span id="stat-gold">0</span></div>
    </aside>
  </div>
  <script src="blockbreak.js"></script>
</body>
</html>
